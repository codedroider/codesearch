<div id="adv-overlay" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-color: rgba(0, 0, 0, 0.75); z-index: 999998; display: flex; justify-content: center; align-items: center; overflow: hidden;">
    <div id="adv-body" style="position: relative; width: 468px; height: 60px;">
        
        <div id="popup-timer" style="position: absolute; top: 5px; left: 5px; color: #ffffff; font-family: Arial, sans-serif; font-size: 11px; background: rgba(0, 0, 0, 0.7); padding: 2px 6px; border-radius: 3px; font-weight: bold; z-index: 999999; pointer-events: none;">3</div>

        <iframe 
            src="https://codebanners.neocities.org/1banner" 
            width="468" 
            height="60" 
            style="border: none; overflow: hidden; display: block; border-radius: 4px;" 
            scrolling="no">
            error loading ad!
        </iframe>
    </div>
</div>

<style>
@media (max-width: 500px) {
    #adv-body {
        transform: scale(calc((100vw - 40px) / 468)) !important;
        transform-origin: center center;
    }
}
</style>

<script>
(function() {
    document.addEventListener("DOMContentLoaded", function() {
        const overlay = document.getElementById('adv-overlay');
        const timerDisplay = document.getElementById('popup-timer');
        let timeLeft = 3;

        if (overlay) {
            overlay.addEventListener('click', function(e) {
                if (e.target === overlay) {
                    e.stopPropagation();
                }
            });

            const countdown = setInterval(function() {
                timeLeft--;
                if (timerDisplay) {
                    timerDisplay.innerText = timeLeft;
                }

                if (timeLeft <= 0) {
                    clearInterval(countdown);
                    overlay.style.display = 'none';
                }
            }, 1000);
        }
    });
})();
</script>
