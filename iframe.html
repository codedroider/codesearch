<div id="adv-overlay" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-color: rgba(0, 0, 0, 0.75); z-index: 999998; display: flex; justify-content: center; align-items: center;">
    <div style="position: relative; width: 468px; height: 80px;">
        
        <div id="adv-close-btn" style="position: absolute; top: -35px; right: -5px; width: 26px; height: 26px; background-color: #ffffff; color: #000000; border-radius: 50%; display: flex; justify-content: center; align-items: center; font-family: Arial, sans-serif; font-size: 18px; font-weight: bold; cursor: pointer; user-select: none; z-index: 999999; box-shadow: 0 2px 5px rgba(0,0,0,0.5);">×</div>

        <iframe 
            src="https://codebanners.neocities.org/1banner" 
            width="468" 
            height="80" 
            style="border: none; overflow: hidden; display: block; border-radius: 4px;" 
            scrolling="no">
            error loading ad!
        </iframe>
    </div>
</div>

<script>
(function() {
    document.addEventListener("DOMContentLoaded", function() {
        const overlay = document.getElementById('adv-overlay');
        const closeBtn = document.getElementById('adv-close-btn');

        if (overlay && closeBtn) {
            closeBtn.addEventListener('click', function() {
                overlay.style.display = 'none'; 
            });

            overlay.addEventListener('click', function(e) {
                if (e.target === overlay) {
                    e.stopPropagation();
                }
            });
        }
    });
})();
</script>
